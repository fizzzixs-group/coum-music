[package]
name = "coum-music"
version = "0.1.0"
description = "Coum Music — минималистичный десктоп-клиент Яндекс.Музыки"
authors = ["Coum Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "coum_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Без этой фичи релизная сборка грузит devUrl (http://127.0.0.1:1420) вместо
# встроенного фронтенда. `tauri dev` запускается с --no-default-features,
# поэтому в разработке фича не мешает.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо native-tls: schannel в этой системе сломан (SEC_E_NO_CREDENTIALS),
# поэтому весь HTTPS идёт через собственный TLS-стек Rust.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
