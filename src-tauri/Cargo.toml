[package]
name = "coum-music"
version = "0.2.0"
description = "Coum Music вЂ” РјРёРЅРёРјР°Р»РёСЃС‚РёС‡РЅС‹Р№ РґРµСЃРєС‚РѕРї-РєР»РёРµРЅС‚ РЇРЅРґРµРєСЃ.РњСѓР·С‹РєРё"
authors = ["Coum Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "coum_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Р‘РµР· СЌС‚РѕР№ С„РёС‡Рё СЂРµР»РёР·РЅР°СЏ СЃР±РѕСЂРєР° РіСЂСѓР·РёС‚ devUrl (http://127.0.0.1:1420) РІРјРµСЃС‚Рѕ
# РІСЃС‚СЂРѕРµРЅРЅРѕРіРѕ С„СЂРѕРЅС‚РµРЅРґР°. `tauri dev` Р·Р°РїСѓСЃРєР°РµС‚СЃСЏ СЃ --no-default-features,
# РїРѕСЌС‚РѕРјСѓ РІ СЂР°Р·СЂР°Р±РѕС‚РєРµ С„РёС‡Р° РЅРµ РјРµС€Р°РµС‚.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls РІРјРµСЃС‚Рѕ native-tls: schannel РІ СЌС‚РѕР№ СЃРёСЃС‚РµРјРµ СЃР»РѕРјР°РЅ (SEC_E_NO_CREDENTIALS),
# РїРѕСЌС‚РѕРјСѓ РІРµСЃСЊ HTTPS РёРґС‘С‚ С‡РµСЂРµР· СЃРѕР±СЃС‚РІРµРЅРЅС‹Р№ TLS-СЃС‚РµРє Rust.
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
